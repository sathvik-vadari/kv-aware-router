[project]
name = "kv-aware-router"
version = "0.1.0"
description = "Routes LLM requests to the replica that already holds their KV cache"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "tokenizers>=0.23.1",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kv_aware_router"]

[dependency-groups]
bench = [
    "mlx-lm>=0.31.3",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
